<p>Sono stati trovati {{products?.total}} prodotti</p>

<div class="d-flex flex-wrap justify-content-around">
    <div class="card" style="width: 18rem;" *ngFor="let product of products?.products">
    <img [src]="product.thumbnail" class="card-img-top" [alt]="product.title">
    <div class="card-body">
        <h5 class="card-title">{{product.title}}</h5>
        <p class="card-text">{{product.price}}€</p>
        <a href="/product" class="btn btn-primary">Acquista</a>
    </div>
    </div>
</div>
