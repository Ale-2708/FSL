<h2>Carrello</h2>

<table class="table">
    <thead>
        <tr>
            <th>Img</th>
            <th>Prodotto</th>
            <th>Prezzo Unitario</th>
            <th>Qta</th>
            <th>Prezzo Totale</th>
            <th>Actions</th>
        </tr>
        
    </thead>
        
    <tbody>
        <tr *ngFor="let p of carrello">
            <td><img [src]="p.thumbnail" [alt]="p.title"></td>
            <td>{{p.title}}</td>
            <td>{{p.price}}</td>
            <td>{{p.qta}}</td>
            <td>{{p.price * p.qta}}</td>
            <td  id="bidone"> 
                <i class="bi bi-plus-circle" (click)="p.addQuantity(1)"></i>
                <i class="bi bi-dash-circle" (click)="p.addQuantity(-1)"></i>
                <i class="bi bi-trash3" (click)="RemoveProduct(p)"></i></td>
        </tr>
    </tbody>

    <tfoot>
        <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td> <b>{{prezzoTotale}}€</b></td>
            <td></td>
        </tr>
    </tfoot>
</table>

<button class="btn btn-primary" routerLink="/checkout">Procedi al Pagamento</button>
